<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News | AI Club IIT Dharwad</title>
  <meta name="description" content="News, announcements, research and achievements from the AI Club at IIT Dharwad.">
  <meta name="theme-color" content="#07070f">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/data.js"></script>
  <script src="assets/js/core.js"></script>
</head>
<body>
<main>
  <header class="page-hero">
    <div class="container">
      <div class="eyebrow reveal">What's happening</div>
      <h1 class="reveal d1">News &amp; <span class="grad-text">updates</span></h1>
      <p class="reveal d2">Achievements, research papers, announcements and stories from the club.</p>
    </div>
  </header>
  <section style="padding-top:20px">
    <div class="container">
      <div id="news-featured"></div>
      <div class="toolbar reveal" style="margin-top:40px">
        <div class="chips" id="cat-filter"></div>
        <label class="search"><span class="sr-only">Search news</span>
          <span class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
          <input type="search" id="news-search" placeholder="Search news">
        </label>
      </div>
      <div class="grid grid-3" id="news-grid"></div>
    </div>
  </section>
</main>
<script src="assets/js/pages/cards.js"></script>
<script src="assets/js/pages/news.js"></script>
</body>
</html>
