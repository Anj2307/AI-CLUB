name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aiclub-iitdh:ci .
      - name: Smoke test
        run: |
          docker run -d --name aiclub -p 3000:3000 -e JWT_SECRET=ci-secret-ci-secret-ci-secret-1234 aiclub-iitdh:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/api/v1/health && exit 0; sleep 1; done
          docker logs aiclub; exit 1
