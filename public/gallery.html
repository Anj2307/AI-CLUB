<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Photos from AI Club IIT Dharwad events, hackathons, workshops and projects.">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

  <header class="page-hero">
    <div class="container">

      <div class="toolbar reveal"><div class="chips" id="album-filter"></div><span class="muted small" id="photo-count"></span></div>

<script src="assets/js/pages/gallery.js"></script>
