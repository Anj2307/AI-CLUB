# Deploy on Render (https://render.com) using the Dockerfile.
# Data lives in Supabase (Postgres + Storage), so the free plan works: restarts and redeploys
# no longer wipe anything. Fill in the sync:false values in the Render dashboard.
services:
  - type: web
    name: aiclub-iitdh
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: aiclub@iitdh.ac.in
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: uploads
